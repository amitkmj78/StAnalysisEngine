name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PIT lookahead-safety and ranking tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        # OPENAI_API_KEY: several Agent/*.py modules construct a
        # ChatOpenAI client at import time (e.g. Agent/financialAgent.py),
        # which raises immediately if the key is entirely absent -- a
        # presence check only, no network call happens at import, so a
        # placeholder is enough to let tests that transitively import
        # those modules collect at all.
        # SESSION_SECRET: web/backend/auth.py reads this at import time
        # (os.environ["SESSION_SECRET"]) -- same presence-only need, no
        # real session is ever verified against it in the test suite.
        env:
          OPENAI_API_KEY: ci-placeholder-key
          SESSION_SECRET: ci-placeholder-session-secret
        run: pytest tests/ -v
